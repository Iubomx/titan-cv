[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvtitan"
version = "0.1.0"
description = "CV TITAN AI — ingeniería de empleabilidad basada en evidencia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["job-search", "resume", "cv", "playwright", "automation", "evidence-based"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "playwright>=1.48",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rich>=13.7",
    "pyfiglet>=1.0",
    "psutil>=5.9",
    "terminaltexteffects>=0.14",
]

[project.optional-dependencies]
pdf = ["docx2pdf>=0.1.8"]
ai = ["anthropic>=2.8"]            # opcional: funciones de IA (desactivadas por defecto)
vault = ["cryptography>=42"]        # opcional: cifrado en reposo con passphrase (`titan vault`)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Stoneroadd/titan-cv"
Issues = "https://github.com/Stoneroadd/titan-cv/issues"
Changelog = "https://github.com/Stoneroadd/titan-cv/blob/main/CHANGELOG.md"

[project.scripts]
cvtitan = "cvtitan.cli:main"

[tool.setuptools]
packages = ["cvtitan", "cvtitan.apply", "cvtitan.web", "cvtitan.ui", "cvtitan.commands"]

[tool.setuptools.package-data]
"cvtitan.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conjunto conservador: errores reales (pyflakes y sintaxis). Se ampliará gradualmente.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E731"]   # nombres de una letra (l, O, I) y lambdas asignadas: estilo, no errores

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"   # solo se reportan los archivos listados en el CI; el resto se tipa por etapas
# Adopción gradual: se tipan primero los módulos listados en el job `typecheck` del CI.
