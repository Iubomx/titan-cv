[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvtitan"
version = "0.1.0"
description = "CV TITAN AI — ingeniería de empleabilidad basada en evidencia"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "anthropic>=2.8",
    "playwright>=1.48",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "rich>=13.7",
    "pyfiglet>=1.0",
    "psutil>=5.9",
    "terminaltexteffects>=0.14",
]

[project.optional-dependencies]
pdf = ["docx2pdf>=0.1.8"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cvtitan = "cvtitan.cli:main"

[tool.setuptools]
packages = ["cvtitan", "cvtitan.apply", "cvtitan.web", "cvtitan.ui"]

[tool.setuptools.package-data]
"cvtitan.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
