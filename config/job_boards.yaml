# CATÁLOGO de portales de empleo (Línea A). Cada portal es una entrada de datos: agregar uno NO requiere código.
# Puedes sumar los tuyos creando config/job_boards.yaml en tu carpeta de trabajo (mismo formato; no reemplaza a los
# integrados). Actívalos por país con `lines.A.market` o con `cvtitan buscar --en nombre1,nombre2`.
#
# Campos de `boards`:
#   name      identificador en minúsculas (a-z, 0-9, _). Es lo que usas en --en y en los grupos de palabras clave.
#   url       plantilla HTTPS de la búsqueda con {keyword} (codificada), {slug} (frase-con-guiones), {location}
#             y {location_slug}. Debe incluir {keyword} o {slug}.
#   job_link  expresión regular (sobre la URL, sin parámetros) que reconoce el enlace de UNA oferta. Sin ella, el
#             programa no sabe qué enlaces del listado son ofertas. Solo agrega portales cuyo patrón hayas comprobado.
#   http      true = el listado y las ofertas se leen sin navegador (HTML con las ofertas); false = requiere el
#             Chrome del robot (el portal bloquea clientes automáticos o carga con JavaScript).
#   title_clean  (opcional) lista de expresiones que se quitan del título de la página, p. ej. el sufijo del sitio.
#   country, label, language, verified (fecha en que se comprobó contra el sitio real).
#
# Responsabilidad: respeta los términos de cada portal y su robots.txt. LinkedIn prohíbe la automatización
# (límites estrictos en config/settings.yaml -> linkedin). Indeed pide verificación humana con frecuencia.
# Lo que NO está aquí a propósito: portales que bloquean todo cliente automático (403) o que solo muestran ofertas
# con JavaScript (Bumeran, Zonajobs, Laborum, Naukri, SimplyHired, Welcome to the Jungle...): sin navegador no se leen.

# Familias: el mismo portal en varios países. `hosts` es código de país -> dominio (comprobados el 2026-11-21).
families:
  computrabajo:
    label: Computrabajo
    url: "https://{host}/trabajo-de-{slug}"
    http: true                      # el patrón de oferta ya está integrado (batch.JOB_LINK_PATTERNS)
    language: es
    verified: "2026-11-21"
    hosts:
      ar: ar.computrabajo.com
      bo: bo.computrabajo.com
      co: co.computrabajo.com
      cr: cr.computrabajo.com
      do: do.computrabajo.com
      ec: ec.computrabajo.com
      gt: gt.computrabajo.com
      hn: hn.computrabajo.com
      mx: mx.computrabajo.com
      ni: ni.computrabajo.com
      pa: pa.computrabajo.com
      pe: pe.computrabajo.com
      py: py.computrabajo.com
      sv: sv.computrabajo.com
      uy: uy.computrabajo.com
      ve: ve.computrabajo.com

  indeed:
