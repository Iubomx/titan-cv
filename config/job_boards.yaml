# Portales sueltos, comprobados contra el sitio real (el listado trae ofertas en el HTML y la página de la oferta
# se lee bien). Rendimiento medido: Reed 25, Job Bank 25, elempleo 20, Catho 19 ofertas por búsqueda.
boards:
  - name: elempleo_co
    label: elempleo (Colombia)
    country: CO
    url: "https://www.elempleo.com/co/ofertas-empleo/?trabajo={keyword}"
    job_link: '^https://www\.elempleo\.com/co/ofertas-trabajo/[a-z0-9-]+-\d+$'
    http: true
    language: es
    verified: "2026-11-21"

  - name: catho_br
    label: Catho (Brasil)
    country: BR
    url: "https://www.catho.com.br/vagas/{slug}/"
    job_link: '^https://www\.catho\.com\.br/vagas/[a-z0-9-]+/\d+/?$'
    http: true
    language: pt
    verified: "2026-11-21"

  - name: reed_uk
    label: Reed (Reino Unido)
    country: UK
    url: "https://www.reed.co.uk/jobs/{slug}-jobs"
    job_link: '^https://www\.reed\.co\.uk/jobs/[a-z0-9-]+/\d+$'
    http: true
    language: en
    verified: "2026-11-21"

  - name: jobbank_ca
    label: Job Bank (Canadá)
    country: CA
    url: "https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring={keyword}"
    job_link: '^https://www\.jobbank\.gc\.ca/jobsearch/jobposting/\d+'
    title_clean: ['\s+-\s+[^-]+,\s+[A-Z]{2}\s+-\s+Job posting\s+-\s+Job Bank$']   # "cargo - Toronto, ON - Job posting - Job Bank"
    http: true
    language: en
    verified: "2026-11-21"
