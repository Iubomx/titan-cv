# PERFIL DE EJEMPLO (ficticio). `cvtitan init` lo copia a candidate/profile.yaml:
# reemplaza todo con tus datos reales. Este archivo es la ÚNICA fuente de verdad del candidato.
#
# Reglas:
# - Cada logro (achievement) es un hecho verificable, con su propio id.
# - Una skill es `backed` solo si `evidence` apunta a ids existentes (logros, proyectos, estudios).
# - `to_demonstrate` = estás aprendiendo o no puedes defenderla aún. Nunca aparece en el CV.
# - Las cifras de un logro son las únicas cifras que el CV podrá usar para ese logro.

