repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: public-scan
        name: public scan (secretos, datos personales, rutas locales)
        entry: python scripts/public_scan.py
        language: system
        pass_filenames: false
